<div class="d-flex mb-3">
    <img class="me-3" src="{{ post.author.avatar(36) }}" alt="{{ post.author.username }}">
    <div>
        <a class="badge text-bg-secondary text-decoration-none"
           href="{{ url_for('user', username=post.author.username) }}">{{ post.author.username }}</a>
        says:<br>
        {{ post.body }}
    </div>
</div>
